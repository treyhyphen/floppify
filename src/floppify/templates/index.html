<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta id="theme-color" name="theme-color" content="#070707">
  <title>Floppify</title>
  <script src="/static/skins/registry.js?v=skins-1"></script>
  <script>
    (() => {
      const skins = window.FLOPPIFY_SKINS || [];
      let saved = null;
      try { saved = localStorage.getItem("floppify-skin"); } catch (_) { /* unavailable */ }
      const requested = new URLSearchParams(window.location.search).get("skin");
      const skin = skins.find((item) => item.id === requested)
        || skins.find((item) => item.id === saved)
        || skins[0];
      if (skin) {
        window.FLOPPIFY_INITIAL_SKIN = skin;
        document.documentElement.dataset.skin = skin.id;
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/skins/base.css?v=skins-1">
  <link id="skin-stylesheet" rel="stylesheet" href="/static/skins/spotify.css?v=skin-1">
  <script>
    if (window.FLOPPIFY_INITIAL_SKIN) {
      document.getElementById("skin-stylesheet").href = window.FLOPPIFY_INITIAL_SKIN.stylesheet;
    }
  </script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="disk-icon">▣</span><strong>FLOPPIFY</strong></div>
      <div id="disk-state" class="status-pill"><i></i><span>Waiting for disk</span></div>
      <label class="skin-picker" for="skin"><span>SKIN</span><select id="skin" aria-label="Interface skin"></select></label>
      <button id="connect" class="connect hidden" type="button">Connect Spotify</button>
      <div class="window-buttons" aria-hidden="true"><span>_</span><span>□</span><span>×</span></div>
    </header>

    <section class="player">
      <div class="art-wrap">
        <img id="art" alt="Album artwork" src="/static/floppy.svg">
        <div id="provider-tag" class="provider-tag">SPOTIFY</div>
      </div>

      <div class="now-playing">
        <p class="eyebrow">NOW PLAYING</p>
        <h1 id="track">Insert a Floppy</h1>
        <p id="artist" class="artist">Drop in a disk with floppify.json</p>
        <p id="album" class="album">Your music will start automatically</p>

        <div class="progress" aria-label="Track progress">
          <div id="progress-fill"></div>
        </div>
        <div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>

        <div class="controls">
          <button id="shuffle" class="control-button" type="button" aria-label="Toggle shuffle" title="Shuffle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M0 3.5A.5.5 0 0 1 .5 3H1c2.202 0 3.827 1.24 4.874 2.418.49.552.926 1.185 1.327 1.9.4-.715.837-1.348 1.327-1.9C9.573 4.24 11.198 3 13.4 3h.5a.5.5 0 0 1 0 1h-.5c-1.842 0-3.163.99-4.022 1.956-.84.945-1.38 2.093-1.7 3.244.32 1.15.86 2.3 1.7 3.244.86.966 2.18 1.956 4.022 1.956h.5a.5.5 0 0 1 0 1h-.5c-2.202 0-3.827-1.24-4.874-2.418A10.6 10.6 0 0 1 6.1 9.61a10.6 10.6 0 0 1-1.226 1.808C3.827 11.76 2.202 13 1 13H.5a.5.5 0 0 1 0-1H1c1.842 0 3.163-.99 4.022-1.956A9.6 9.6 0 0 0 6.722 6.8a9.6 9.6 0 0 0-1.7-3.244C4.163 2.49 2.842 1.5 1 1.5H.5A.5.5 0 0 1 0 .5z"/></svg>
          </button>
          <button id="previous" class="control-button" type="button" aria-label="Previous track" title="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6z"/><path d="M20 6l-9 6 9 6z"/></svg>
          </button>
          <button id="play" class="control-button control-button--primary" type="button" aria-label="Play" title="Play or pause">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button id="next" class="control-button" type="button" aria-label="Next track" title="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2z"/><path d="M4 6l9 6-9 6z"/></svg>
          </button>
          <button id="refresh" class="control-button" type="button" aria-label="Refresh devices" title="Refresh devices">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <footer class="device-bar">
      <label for="devices"><span class="speaker">◉</span> PLAY ON</label>
      <select id="devices" aria-label="Spotify playback device"><option value="">No active devices</option></select>
      <label class="volume" for="volume"><span>VOL</span><input id="volume" type="range" min="0" max="100" value="50"></label>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <footer class="taskbar" aria-hidden="true">
    <button class="start-button" type="button" tabindex="-1"><span class="start-flag"></span>Start</button>
    <div class="task-button"><span class="mini-disk">▣</span>Floppify Player</div>
    <div class="taskbar-spacer"></div>
    <div class="tray"><span class="tray-led"></span><span id="taskbar-clock">12:00 PM</span></div>
  </footer>
  <script src="/static/app.js?v=skins-1" defer></script>
</body>
</html>
