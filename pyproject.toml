[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floppify"
version = "0.1.0"
description = "Turn floppy disks into physical Spotify albums and playlists."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "treyhyphen"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1",
  "soco>=0.31,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
floppify = "floppify.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/floppify"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
